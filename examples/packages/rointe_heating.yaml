# Rointe storage heater - helpers for the Heating dashboard.
#
# Everything the dashboard needs that the integration itself does not provide.
# To remove all of it: delete this file and the packages line in
# configuration.yaml.

input_datetime:
  economy7_start:
    name: Economy 7 starts
    icon: mdi:weather-night
    has_date: false
    has_time: true
    initial: "00:30:00"
  economy7_end:
    name: Economy 7 ends
    icon: mdi:weather-sunset-up
    has_date: false
    has_time: true
    initial: "07:30:00"

input_number:
  heater_storage_capacity:
    name: Heater storage capacity
    icon: mdi:battery-high
    min: 1
    max: 40
    step: 0.5
    unit_of_measurement: kWh
    mode: box
    initial: 10

template:
  - binary_sensor:
      - name: Economy 7 window
        unique_id: economy7_window
        icon: mdi:clock-time-two-outline
        # Set the two helpers above to the times your meter actually switches.
        # Handles a window that crosses midnight, which E7 always does.
        state: >
          {% set s = states('input_datetime.economy7_start') %}
          {% set e = states('input_datetime.economy7_end') %}
          {% if s in ['unknown', 'unavailable'] or e in ['unknown', 'unavailable'] %}
            false
          {% else %}
            {% set n = now().hour * 60 + now().minute %}
            {% set sm = s.split(':')[0] | int * 60 + s.split(':')[1] | int %}
            {% set em = e.split(':')[0] | int * 60 + e.split(':')[1] | int %}
            {{ (sm <= n < em) if sm < em else (n >= sm or n < em) }}
          {% endif %}

  - sensor:
      - name: Living room heater charge headroom
        unique_id: rointe_lr_charge_headroom
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery-plus-outline
        # How much more it is allowed to take, given the ceiling you set.
        state: >
          {% set c = states('sensor.living_room_sh_abc123_charge') | float(0) %}
          {% set l = states('number.living_room_sh_abc123_maximum_charge') | float(100) %}
          {{ [l - c, 0] | max | round(0) }}
        availability: >
          {{ has_value('sensor.living_room_sh_abc123_charge') }}

      - name: Living room heater stored energy
        unique_id: rointe_lr_stored_energy
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
        icon: mdi:battery-high
        # Charge percentage against the capacity helper above. Rointe report
        # charging_consuption: 10000 on this model, which reads as 10 kWh of
        # usable storage and fits both the overnight gain and the idle
        # discharge rate. Correct the helper if you ever meter the circuit.
        state: >
          {{ ((states('sensor.living_room_sh_abc123_charge') | float(0) / 100)
              * (states('input_number.heater_storage_capacity') | float(10))) | round(2) }}
        availability: >
          {{ has_value('sensor.living_room_sh_abc123_charge') }}


  # Charge at the moment a charging session starts, so the session's net gain
  # can be measured end to end.
  #
  # Summing every rise in charge percentage does NOT work: the signal swings by
  # tens of percent within an hour around the charge window, so on 24 Aug 2026
  # it accumulated 171 % of "gain" on a day whose net change was minus 8. Taking
  # the two endpoints of a session sidesteps all of that.
  - trigger:
      - trigger: state
        entity_id: binary_sensor.living_room_sh_abc123_charging
        from: "off"
        to: "on"
    sensor:
      - name: Living room heater charge at session start
        unique_id: rointe_lr_charge_at_session_start
        unit_of_measurement: "%"
        icon: mdi:ray-start
        state: >
          {{ states('sensor.living_room_sh_abc123_charge') | float(0) | round(0) }}

  # Energy taken in today: the net percentage gained across each completed
  # charging session, against the capacity helper. Still an ESTIMATE - it
  # inherits whatever charge_percentage really means, and that is not fully
  # understood. Time-charging times nameplate power was worse: the heater is an
  # inverter and modulates, so that overstated it by roughly six times.
  - trigger:
      - trigger: state
        entity_id: binary_sensor.living_room_sh_abc123_charging
        from: "on"
        to: "off"
        id: session_end
      - trigger: time
        at: "00:00:00"
        id: midnight
    sensor:
      - name: Living room heater charge energy today
        unique_id: rointe_lr_charge_energy_today
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        icon: mdi:lightning-bolt
        state: >
          {% if trigger.id == 'midnight' %}
            0
          {% else %}
            {% set started = states('sensor.living_room_heater_charge_at_session_start') | float(-1) %}
            {% set ended = states('sensor.living_room_sh_abc123_charge') | float(-1) %}
            {% set cap = states('input_number.heater_storage_capacity') | float(10) %}
            {% set gain = (ended - started) if (started >= 0 and ended >= 0) else 0 %}
            {{ ((this.state | float(0)) + ([gain, 0] | max) / 100 * cap) | round(2) }}
          {% endif %}

  # Snapshots the charge the moment the cheap window closes. Over a winter this
  # is the number that answers whether 7 hours of Economy 7 is actually enough.
  - trigger:
      - trigger: state
        entity_id: binary_sensor.economy_7_window
        from: "on"
        to: "off"
    sensor:
      - name: Living room heater charge after Economy 7
        unique_id: rointe_lr_charge_after_e7
        unit_of_measurement: "%"
        icon: mdi:battery-check
        state: >
          {{ states('sensor.living_room_sh_abc123_charge') | float(0) | round(0) }}

sensor:
  - platform: history_stats
    name: Living room heater charging today
    unique_id: rointe_lr_charging_today
    entity_id: binary_sensor.living_room_sh_abc123_charging
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

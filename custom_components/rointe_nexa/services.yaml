set_charge_hours:
  name: Set charge hours
  description: >-
    Choose which hours the heater is allowed to charge. This is the field to
    drive from electricity prices. Turn Smart charging off first if you want
    these hours obeyed exactly.
  target:
    entity:
      integration: rointe_nexa
  fields:
    hours:
      name: Hours
      description: >-
        Hours of the day to charge, 0-23. The hour number is the hour that
        starts then, so [1,2,3] charges 01:00-04:00.
      required: true
      example: "[1, 2, 3, 4, 5]"
      selector:
        object:
    days:
      name: Days
      description: Weekdays to apply to, 0 = Monday. Defaults to every day.
      required: false
      example: "[0, 1, 2, 3, 4]"
      selector:
        object:

set_heating_schedule:
  name: Set heating schedule
  description: >-
    Set the 24-hour heating programme for one or more days.
  target:
    entity:
      integration: rointe_nexa
  fields:
    schedule:
      name: Schedule
      description: >-
        Exactly 24 characters, one per hour - C comfort, E eco, O anti-frost.
      required: true
      example: "OOOOOOCCCCCCEEEEEECCCCCC"
      selector:
        text:
    days:
      name: Days
      description: Weekdays to apply to, 0 = Monday. Defaults to every day.
      required: false
      selector:
        object:

boost:
  name: Boost
  description: Run the heater at a set temperature for a set time.
  target:
    entity:
      integration: rointe_nexa
  fields:
    temperature:
      name: Temperature
      description: Target temperature while boosting.
      required: false
      example: 21
      selector:
        number:
          min: 7
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      name: Duration
      description: How long to boost for, in minutes.
      required: false
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min

set_travel_mode:
  name: Set travel mode
  description: >-
    Switch the heaters off for a period, the same way the Nexa app's Travel
    mode does. Rointe's servers hold the period and switch every product in the
    installation off for it, so this works even if Home Assistant is down.
    Replaces any travel periods already set.
  target:
    entity:
      integration: rointe_nexa
  fields:
    start:
      name: Start
      description: >-
        When travel mode starts. A time without an offset is taken as
        Home Assistant's local time.
      required: true
      example: "2026-12-20 08:00:00"
      selector:
        datetime:
    end:
      name: End
      description: When the heaters come back on. Leave empty for indefinite.
      required: false
      example: "2026-12-27 12:00:00"
      selector:
        datetime:

clear_travel_mode:
  name: Clear travel mode
  description: >-
    Remove every travel period and switch travel mode off, as clearing it in
    the Nexa app does.
  target:
    entity:
      integration: rointe_nexa
